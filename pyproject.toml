[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inputbat3-vector_index_recall_cost_coverage_map"
version = "0.1.0"
description = "把候选项映射到类别上，算出实时数仓架构师·向量索引的召回与构建代价的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "inputbat3" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://inputbat3.github.io"
Repository = "https://github.com/inputbat3/vector_index_recall_cost_coverage_map"
Issues = "https://github.com/inputbat3/vector_index_recall_cost_coverage_map/issues"

[project.scripts]
vector_index_recall_cost_coverage_map = "vector_index_recall_cost_coverage_map:main"

[tool.setuptools]
py-modules = ["vector_index_recall_cost_coverage_map"]
